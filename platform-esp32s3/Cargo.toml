[package]
name = "rlvgl-platform-esp32s3"
version = "0.1.0"
authors = ["Maxi <maxi@aibi-libre.io>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 platform implementation for rlvgl."
readme = "README.md"
publish = false

# The crate body is cfg-gated to `target_arch = "xtensa"` in `src/lib.rs`,
# so the embedded-only dependency stack is also target-gated here. This
# keeps the workspace host-buildable (no Xtensa toolchain / nightly needed
# for `cargo check --workspace` or pre-commit hooks) while still pulling
# the full driver dependencies on `--target xtensa-esp32s3-none-elf`.
[target.'cfg(target_arch = "xtensa")'.dependencies]
rlvgl-core = { path = "../core", default-features = false }
rlvgl-platform = { path = "../platform", default-features = false }
esp-hal = { version = "0.22", features = ["esp32s3"] }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
display-interface = "0.5"
display-interface-spi = "0.5"
log = "0.4"

# Runtime support crates needed by the `aibi_face_demo` example. They live in
# dev-dependencies because the library itself stays panic/println agnostic.
#
# Target-gated for the same reason as the `[dependencies]` block above: these
# crates are Xtensa/RISC-V only. `esp-backtrace` in particular selects its
# `arch` module with `#[cfg_attr(target_arch = "riscv32"/"xtensa", path = ...)]`,
# so on a host target no `arch` file resolves and it fails to compile with
# E0583. `cargo check --workspace` never noticed because dev-dependencies are
# only built for test/example/bench targets — `--all-targets` builds the lib's
# unit-test target, which links dev-deps, and that is what broke the host build.
[target.'cfg(target_arch = "xtensa")'.dev-dependencies]
esp-backtrace = { version = "0.14", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32s3", "log"] }
embedded-hal-bus = "0.2"

# The example is `#![no_std] #![no_main]` and uses esp-hal/esp-backtrace
# unconditionally, so it can only ever be built for the Xtensa target. Cargo
# has no cfg gate for target definitions, so gate it behind a non-default
# feature instead; that keeps `--all-targets` from trying to build it on the
# host without deleting the example.
[[example]]
name = "aibi_face_demo"
required-features = ["hw"]

[features]
default = []
# Opt-in flag for the on-device example targets. Only meaningful when building
# for `xtensa-esp32s3-none-elf`; enabling it on the host will not compile.
hw = []
