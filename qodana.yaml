version: "1.0"

# Explicit rather than relying on the CLI's language auto-detection. Detection
# does work -- bifrost scanned correctly with no linter key -- but it makes the
# analyzer a function of whatever files happen to be present, which is a bad
# property for a nightly gate on a mixed repo.
linter: qodana-rust

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - target
      - .git
      - .claude/worktrees
      - .maxi-worktrees
      - .worktrees
      - node_modules
      - vendor
      - "**/tests/**"
      - "**/benches/**"
      - "**/examples/**"
